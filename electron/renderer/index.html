<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>HuePick — 拾色</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="layout">
    <!-- 左栏：品牌 + 拖拽 + 文件列表 + 清除按钮 -->
    <section class="panel left">
      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="HuePick" />
        <div class="brand-text">
          <div class="brand-name-cn">拾色</div>
          <div class="brand-name-en">HuePick</div>
        </div>
      </div>

      <div id="drop" class="dropzone" title="点击选择图片（可多选），或拖拽图片/文件夹到此处">
        <div class="drop-inner">
          <div class="drop-icon">⬇</div>
          <div class="drop-hint">拖拽图片或文件夹到此处</div>
          <div class="drop-hint-sm"><span class="link" id="link-select">选择图片</span> · <span class="link" id="link-folder">选择文件夹</span></div>
          <div class="drop-hint-xs">支持 PNG / JPG / WEBP / BMP / TIFF</div>
        </div>
      </div>

      <div class="file-list" id="file-list" tabindex="0"></div>

      <button id="btn-clear" class="clear-btn">清空列表</button>
    </section>

    <!-- 右栏：参数 + 预览 -->
    <section class="panel right">
      <div class="params">
        <div class="param-row">
          <label>色数</label>
          <select id="p-colors">
            <option>3</option><option>4</option><option>5</option>
            <option selected>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option><option>11</option><option>12</option>
          </select>
        </div>
        <div class="param-row">
          <label>模板</label>
          <select id="p-template">
            <option value="landscape" selected>横版 1920×1080</option>
            <option value="portrait">竖版 1080×1920</option>
            <option value="square">方版 1080×1080</option>
            <option value="compact">紧凑 1200×800</option>
            <option value="thumb">缩略 800×450</option>
            <option value="palette">色板 1200×240</option>
          </select>
        </div>
        <!-- theme hidden, functionality preserved via JS -->
        <input type="hidden" id="p-theme" value="dark" />
        <div class="param-row">
          <label>格式</label>
          <select id="p-format">
            <option value="jpg" selected>JPG（体积小）</option>
            <option value="png">PNG（无损）</option>
          </select>
        </div>
        <div class="param-row param-crop">
          <label>裁切图片多于黑边</label>
          <input type="checkbox" id="p-crop" checked />
        </div>
        <div class="param-spacer"></div>
        <button id="btn-generate" class="primary">生成色卡</button>
      </div>

      <div class="preview" id="preview">
        <div class="preview-empty">
          <div class="pe-icon">🎯</div>
          <div>选择图片后自动生成预览</div>
        </div>
      </div>

      <div class="log" id="log"></div>
    </section>
  </main>

  <!-- 底边栏：版本 + 状态提示 -->
  <footer class="statusbar">
    <span class="status-ver" id="ver">v1.2.0</span>
    <span class="status-text" id="status-text">就绪</span>
    <button class="status-cache" id="btn-clear-cache" title="清理预览缓存">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      <span class="status-cache-size" id="cache-size">0 B</span>
    </button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
